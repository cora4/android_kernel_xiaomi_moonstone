name: Build ARM64 Linux Kernel (LLVM)

on:
  push:
    branches: [ "6f584e0" ]
  pull_request:
    branches: [ "6f584e0" ]

jobs:
  build:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
    - name: Check clang version
      run: clang --version
    - name: mkdir cache dir
      run: mkdir -p ~/.ccache
    - name: Install dependencies
      run: brew install ccache gnu-sed lld
    - name: Add LLVM to PATH
      run:  echo $(brew --prefix llvm@22)/bin >> $GITHUB_PATH
    - name: Add GNU sed to PATH
      run:  echo /opt/homebrew/opt/gnu-sed/libexec/gnubin >> $GITHUB_PATH
    - name: Show nproc
      run: sysctl -n hw.ncpu
    - name: Show sed version
      run: sed --version
    - name: Cache ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-ccache-
    - name: Configure kernel
      run: ARCH=arm64 KBUILD_OUTPUT=build make "CC=ccache clang  -I/opt/homebrew/include -L/opt/homebrew/lib" LLVM=1 LLVM_IAS=1 gemstone_defconfig
    - name: Build kernel
      id: gmake_build
      run: ARCH=arm64 KBUILD_OUTPUT=build make "CC=ccache clang  -I/opt/homebrew/include -L/opt/homebrew/lib" LLVM=1 LLVM_IAS=1 -j$(sysctl -n hw.ncpu)
    - name: Show ccache stats
      run: ccache -s
    - name: Upload Build Artifact
      if: ${{ always() && steps.gmake_build.outcome == 'success' }}
      uses: actions/upload-artifact@v6
      with:
        name: moonstone-kernel
        path: build/arch/arm64/boot/
