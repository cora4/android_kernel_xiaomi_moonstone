name: Build ARM64 Linux Kernel (LLVM)

on:
  push:
    branches: [ "6f584e0" ]
  pull_request:
    branches: [ "6f584e0" ]

jobs:
  build:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
    - name: Install Homebrew cross-toolchain & dependencies
      run: |
        brew install ccache gnu-sed lld make
        brew tap messense/macos-cross-toolchains
        brew install aarch64-unknown-linux-gnu

    - name: Set environment variables
      run: |
        echo "KBUILD_OUTPUT=build" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-unknown-linux-gnu-" >> $GITHUB_ENV
        echo "PATH=/opt/homebrew/opt/llvm/bin:$PATH" >> $GITHUB_ENV
    - name: Add GNU bash to PATH
      run:  echo /opt/homebrew/opt/bash/bin/ >> $GITHUB_PATH;export 
    - name: Add LLVM to PATH
      run:  echo $(brew --prefix llvm@22)/bin >> $GITHUB_PATH
    - name: Add GNU sed to PATH
      run:  echo /opt/homebrew/opt/gnu-sed/libexec/gnubin >> $GITHUB_PATH;echo /opt/homebrew/opt/make/libexec/gnubin/ >> $GITHUB_PATH

    - name: Cache ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ hashFiles('**/*.c', '**/*.cpp', '**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-ccache-
          
    - name: Clean kernel tree
      run: make mrproper

    - name: Configure kernel
      run: make defconfig

    - name: Build Linux kernel with Clang
      id: gmake_build
      run: |
        make -j$(sysctl -n hw.ncpu) CC=clang HOSTCC=clang LLVM=1

    - name: Archive built kernel
      if: ${{ always() && steps.gmake_build.outcome == 'success' }}
      uses: actions/upload-artifact@v6
      with:
        name: moonstone-kernel
        path: arch/arm64/boot/
