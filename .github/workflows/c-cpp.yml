name: C/C++ CI

on:
  push:
    branches: [ "6f584e0" ]
  pull_request:
    branches: [ "6f584e0" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: export ARCH=arm64; export CROSS_COMPILE=aarch64-linux-gnu-
    - name: make
      run: TARGET_BUILD_VARIANT=user scripts/gki/generate_defconfig.sh gemstone_defconfig
    - name: make check
      run: KBUILD_OUTPUT=build make "CC=ccache clang" LLVM=1 gemstone_defconfig
    - name: compile
      run: KBUILD_OUTPUT=build make "CC=ccache clang" LLVM=1 -j$(nproc)
    - name: Upload Build Artifact
      if: ${{ always() && steps.compile.outcome == 'success' }}
      uses: actions/upload-artifact@v6
      with:
        name: moonstone-kernel
        path: build/arch/arm64/boot/
